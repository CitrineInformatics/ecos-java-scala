name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  SBT_OPTS: "-Xmx4G -XX:+UseG1GC"

jobs:
  native:
    name: Native library (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # platform must equal the directory name sbt-jni derives from `uname -sm`
        include:
          - runner: ubuntu-latest
            platform: x86_64-linux
          - runner: ubuntu-24.04-arm
            platform: aarch64-linux
          - runner: macos-latest
            platform: arm64-darwin
          - runner: macos-15-intel
            platform: x86_64-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Silence ECOS prints and profiling
        run: ./scripts/silence-ecos-logs

      - name: Build the native library and run tests
        run: sbt -Dsbt.log.noformat=true nativeCompile test

      - name: Check the platform directory name
        run: ls "target/native/${{ matrix.platform }}/bin/"

      - name: Upload the native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: target/native/${{ matrix.platform }}/bin/libecos0.*
          if-no-files-found: error

  package:
    name: Package every platform into one jar
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Silence ECOS prints and profiling
        run: ./scripts/silence-ecos-logs

      # Each artifact is named by platform, so this lands them at lib_native/<platform>/libecos0.*,
      # the layout sbt-jni packages as native/<platform>/ in the jar. The host build of
      # x86_64-linux maps to the same path and sbt-jni keeps one copy.
      - name: Download the native libraries
        uses: actions/download-artifact@v4
        with:
          path: lib_native

      - name: Build the jar
        run: sbt -Dsbt.log.noformat=true test package

      - name: Check the jar holds every platform
        run: ./scripts/check-jar-platforms

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: sbt -Dsbt.log.noformat=true publish
